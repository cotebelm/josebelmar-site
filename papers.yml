- title: "Drought and the Power Mix in Latin America: Short-Run Substitution and Long-Run Investment"
  section: progress
  status: "Draft coming soon"
  coauthors:
    - name: Lenin Balza
      url: https://scholar.google.com/citations?user=1K-_JF0AAAAJ
    - name: Ye-Rim Lee
      url: https://scholar.google.com/citations?user=nNA5_wwAAAAJ
  abstract: >-
    Hydropower generates two fifths of Latin America's electricity, while the region's droughts grow more frequent and more intense. This paper measures their effects on power supply in three steps: the hydropower lost, how the shortfall is covered, and what gets built afterwards. We use a monthly panel of 2,814 plants in ten systems of Brazil, Chile, Colombia, Ecuador and Peru, 70% of the region's hydropower capacity, for 2000–2024, and measure drought with runoff anomalies in each plant's basin. One standard deviation of scarcity lowers a system's hydro output by 8.8% of mean generation; a basin in drought loses a sixth of its hydro output within six months, and its reservoirs lose more than its run-of-river plants. Where a system can trade, imports cover part of the loss. Every system burns more thermal fuel: thermal output rises 19%, at plants burning diesel, fuel oil or a mix of gas and oil, mostly lightly used plants that are already running, and not at gas plants. At fixed emission factors, CO₂ rises 18% and SO₂ 23%. After three years of scarcity, new thermal plants enter in Brazil and Chile; in Colombia, new hydro follows a single dry year. What a system emits in dry years depends on the backup plants it keeps.

- title: "Who Turned On the Lights? Electricity Supply Shocks and Development in Ecuador"
  section: progress
  status: "Draft coming soon"
  coauthors:
    - name: Julio Acuña
      url: https://www.julioacuna.com/
    - name: Lenin Balza
      url: https://scholar.google.com/citations?user=1K-_JF0AAAAJ
    - name: Nicolás Gómez-Parra
      url: https://scholar.google.com/citations?user=1xjpsMgAAAAJ
  abstract: >-
    We estimate the causal effect of electricity-service reliability—the quality of an existing connection rather than access to it—on local productive activity in Ecuador, where hydropower supplies close to 80 percent of generation. We measure reliability from the regulator's interruption records and estimate dynamic responses with a local-projections instrumental-variables design, instrumenting municipal reliability with a shift-share instrument based on river runoff anomalies (deviations from historical means), weighted by upstream hydroelectric capacity and distance. The most robust response is compositional: improved reliability shifts the local firm population toward younger firms—average firm age falls, consistent with rising entry and falling exit—with the clearest activity response among young firms, whose exports rise over the medium run. Local sales, exports, payroll and wages move in the same direction but are individually imprecise, while employment shows no response. Because the identifying variation is drought-driven, the results also speak to how climate variability reaches firms through the electricity channel in hydro-dependent economies.

- title: "A Tale of Two Pathways: The Local Economic Impacts of Solar Energy Investments in Colombia"
  section: progress
  status: "Draft coming soon"
  coauthors:
    - name: Lenin Balza
      url: https://scholar.google.com/citations?user=1K-_JF0AAAAJ
    - name: Laura Heras
      url: https://lauraherasrec.github.io/
  abstract: >-
    Solar investment comes in two forms: large plants connected to the grid and small systems installed by households and firms for their own use. We study their local economic effects in Colombia, where between 2017 and 2024 small plants were 99% of the solar plants installed and large plants 87% of the new capacity. We combine plant-level data on solar investment with a municipal panel of formal employment, tax revenue and value added, and estimate local projections separately for plants above and below 1 MW. Large plants follow the cycle of a construction project: construction employment and tax revenue rise while they are built and employment falls after start-up, value added rises in the primary sector, and neighbouring municipalities lose workers. Small plants raise formal employment one year after start-up, across trade and services, and raise municipal tax revenue, largely through the tax on local business income, with no effect on total measured value added and positive spillovers to neighbouring municipalities. The local footprint of solar deployment depends on the scale at which it is installed.

